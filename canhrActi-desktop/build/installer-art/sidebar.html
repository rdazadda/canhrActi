<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Installer sidebar</title>
<style>
  @font-face {
    font-family: 'Roboto';
    font-style: normal;
    font-weight: 100 900;
    src: url('../../../inst/shiny/canhrActi_dashboard/www/fonts/roboto-latin.woff2') format('woff2');
  }

  /* The dashboard's shell band, light theme. */
  :root {
    --band: #262f3c;
    --tile: #ffffff;
    --name: #ffffff;
  }

  html, body {
    margin: 0;
    width: 164px;
    height: 314px;
    overflow: hidden;
  }
  body {
    position: relative;
    background: var(--band);
    font-family: 'Roboto', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .brand {
    position: absolute;
    left: 12px;
    top: 16px;
  }
  .tile {
    width: 48px;
    height: 48px;
    padding: 4px;
    box-sizing: border-box;
    border-radius: 8px;
    background: var(--tile);
  }
  .tile img {
    display: block;
    width: 100%;
    height: 100%;
  }
  .name {
    margin-top: 12px;
    font-size: 22px;
    font-weight: 500;
    line-height: 26px;
    color: var(--name);
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="brand">
    <div class="tile"><img src="../icon.png" alt=""></div>
    <div class="name">CANHRActi</div>
  </div>
</body>
</html>
