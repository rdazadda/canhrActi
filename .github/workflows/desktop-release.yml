name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: win
            arch: x64
            r-version: "4.5.3"
          - os: macos-26            # Apple Silicon (arm64)
            target: mac
            arch: arm64
            r-version: "4.5.3"
          - os: macos-26-intel      # native Intel x86_64 (macOS 26 is the final Intel-capable line)
            target: mac
            arch: x64
            r-version: "4.5.3"
          - os: ubuntu-24.04
            target: linux
            arch: x64
            r-version: "4.5.3"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: canhrActi-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: canhrActi-desktop/package-lock.json

      - name: Install Linux system dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev \
            libfribidi-dev libpng-dev libjpeg-dev libtiff5-dev \
            libcairo2-dev libxt-dev

      - name: Install gfortran (macOS)
        if: matrix.target == 'mac'
        shell: bash
        run: |
          if [ ! -x /opt/gfortran/bin/gfortran ]; then
            curl -fsSL -o /tmp/gfortran.pkg \
              https://github.com/R-macos/gcc-14-branch/releases/download/gcc-14.2-darwin-r2.1/gfortran-14.2-universal.pkg
            sudo installer -pkg /tmp/gfortran.pkg -target /
            rm /tmp/gfortran.pkg
          fi
          /opt/gfortran/bin/gfortran --version
          ls /opt/gfortran/lib/gcc/*-apple-darwin*/14.2.0/libemutls_w.a 2>&1 || true

      - name: Install Node dependencies
        run: npm ci

      - name: Cache R bundle
        id: cache-r
        uses: actions/cache@v4
        with:
          path: canhrActi-desktop/resources/R
          key: portable-r-${{ matrix.r-version }}-${{ matrix.os }}-${{ matrix.arch }}-v5-${{ hashFiles('canhrActi-desktop/scripts/fetch-r-portable.js') }}-${{ hashFiles('DESCRIPTION', 'NAMESPACE', 'R/**', 'src/**', 'inst/shiny/**') }}

      - name: Validate cached R bundle
        if: steps.cache-r.outputs.cache-hit == 'true'
        shell: bash
        run: |
          ok=true
          case "${{ matrix.target }}" in
            win)   { [ -f resources/R/bin/x64/Rscript.exe ] || [ -f resources/R/bin/Rscript.exe ]; } || ok=false ;;
            mac)   { [ -f resources/R/R.framework/Resources/Rscript ] || [ -f resources/R/bin/Rscript ]; } || ok=false ;;
            linux) [ -f resources/R/bin/Rscript ] || ok=false ;;
          esac
          if [ "$ok" = "false" ]; then
            echo "Cached R bundle is incomplete; wiping so fetch-r-portable re-downloads."
            rm -rf resources/R
          fi

      - name: Fetch R
        run: node scripts/fetch-r-portable.js --platform ${{ matrix.target }} --arch ${{ matrix.arch }} --version ${{ matrix.r-version }}

      - name: Verify R works (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$PWD/resources/R/lib/R/lib:$LD_LIBRARY_PATH"
          ls -la resources/R/bin/ || true
          ls -la resources/R/lib/R/lib/ || true
          ./resources/R/bin/Rscript --version || echo "Rscript failed; will rely on env in run-install.js"

      - name: Verify R works (macOS)
        if: matrix.target == 'mac'
        shell: bash
        run: |
          ls -la resources/R/ || true
          ls -la resources/R/R.framework/Resources/ 2>/dev/null || ls -la resources/R/bin/ 2>/dev/null || true
          resources/R/R.framework/Resources/Rscript --version 2>&1 || resources/R/bin/Rscript --version 2>&1 || true

      - name: Configure gettext for data.table compile (macOS)
        if: matrix.target == 'mac'
        shell: bash
        run: |
          brew install gettext
          GETTEXT="$(brew --prefix gettext)"
          mkdir -p ~/.R
          # data.table compiles from source on macOS and needs libintl.h/-lintl
          # from gettext. Env CPPFLAGS doesn't reach the compile (Makeconf shadows
          # it); ~/.R/Makevars is the hook pak/pkgbuild honors. Use += to append.
          {
            echo "CPPFLAGS += -I${GETTEXT}/include"
            echo "LDFLAGS  += -L${GETTEXT}/lib"
          } >> ~/.R/Makevars
          echo "R_MAKEVARS_USER=$HOME/.R/Makevars" >> "$GITHUB_ENV"
          echo "----- ~/.R/Makevars -----"; cat ~/.R/Makevars

      - name: Install canhrActi and pinned packages
        run: npm run setup:packages

      - name: Strip R bundle
        run: npm run setup:strip

      - name: Build installer (Windows)
        if: matrix.target == 'win'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win

      - name: Build installer (macOS)
        if: matrix.target == 'mac'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:mac:${{ matrix.arch }}

      - name: Build installer (Linux)
        if: matrix.target == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:linux

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: canhrActi-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            canhrActi-desktop/dist/*.exe
            canhrActi-desktop/dist/*.dmg
            canhrActi-desktop/dist/*.AppImage
          if-no-files-found: warn
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            canhrActi-desktop/dist/*.exe
            canhrActi-desktop/dist/*.dmg
            canhrActi-desktop/dist/*.AppImage
