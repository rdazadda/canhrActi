<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
<title>CANHRActi</title>
<style>
  :root {
    --ink: #003F87;
    --ink-2: #236192;
    --body: #475569;
    --muted: #94A3B8;
    --hairline: #E2E8F0;
    --serif: ui-serif, "New York", "Iowan Old Style", "Cambria", Georgia, "Times New Roman", serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI Variable", "Segoe UI", Cantarell, "Liberation Sans", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    -webkit-app-region: drag;
    background: transparent;
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .card {
    position: absolute; inset: 0;
    background: #ffffff;
    border: 1px solid var(--hairline);
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 16px 40px rgba(15, 23, 42, 0.16);
    overflow: hidden;
  }
  /* Subtle film-grain texture so the surface doesn't read as flat pixels */
  .card::before {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    opacity: 0.015;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .content {
    position: absolute;
    left: 32px; right: 32px; top: 24px; bottom: 22px;
  }

  .eyebrow {
    font-family: var(--sans);
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-2);
    line-height: 1.2;
    margin-top: 4px;
    opacity: 0; transform: translateY(4px);
    animation: rise 360ms 200ms var(--ease) forwards;
  }

  .wordmark {
    font-family: var(--serif);
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
    line-height: 1;
    margin-top: 38px;
    opacity: 0; transform: translateY(6px);
    animation: rise 420ms 280ms var(--ease) forwards;
  }

  .tagline {
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 400;
    color: var(--body);
    line-height: 1.3;
    margin-top: 12px;
    opacity: 0; transform: translateY(4px);
    animation: rise 360ms 400ms var(--ease) forwards;
  }

  .mark {
    position: absolute;
    right: 32px; top: 48px;
    width: 96px; height: 96px;
    opacity: 0; transform: scale(0.96);
    animation: pop 420ms 480ms var(--ease) forwards;
    image-rendering: -webkit-optimize-contrast;
  }

  .rule {
    position: absolute;
    left: 32px; bottom: 56px;
    width: 160px; height: 1px;
    background: var(--hairline);
    transform-origin: left;
    transform: scaleX(0);
    animation: drawRight 480ms 600ms var(--ease) forwards;
  }

  .status {
    position: absolute;
    left: 32px; right: 32px; bottom: 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    opacity: 0;
    animation: fade 320ms 650ms var(--ease) forwards;
  }

  .loading {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  .meta {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .meta .sep { opacity: 0.5; padding: 0 4px; }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pop {
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes fade {
    to { opacity: 1; }
  }
  @keyframes drawRight {
    to { transform: scaleX(1); }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="content">
      <div class="eyebrow">Center for Alaska Native Health Research</div>
      <div class="wordmark">CANHRActi</div>
      <div class="tagline">Accelerometer Data Analysis Software</div>
    </div>

    <img class="mark" src="icon.png" alt="" />

    <div class="rule"></div>

    <div class="status">
      <div class="loading">Loading</div>
      <div class="meta">v0.3.0<span class="sep">·</span>CANHR</div>
    </div>
  </div>
</body>
</html>
