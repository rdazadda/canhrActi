<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CANHRActi</title>
<link rel="stylesheet" href="ui.css">
<script src="ui.js"></script>
<script src="splash.js" defer></script>
</head>
<body>
<main class="card splash" id="card" data-state="loading" data-stage="r">

  <section class="panel state state-loading" aria-labelledby="app-name">
    <img class="app-icon" src="icon.png" alt="">
    <div class="lockup-text">
      <h1 class="app-name" id="app-name">CANHRActi</h1>
    </div>
    <div class="progress" id="progress" role="progressbar" aria-label="Starting CANHRActi"
         aria-valuemin="0" aria-valuemax="4" aria-valuenow="1">
      <div class="progress-fill"></div>
    </div>
  </section>

  <section class="panel state state-error" role="alertdialog" aria-labelledby="err-title">
    <img class="app-icon" src="icon.png" alt="">
    <div class="lockup-text">
      <h1 class="err-title" id="err-title">CANHRActi could not start</h1>
    </div>
    <div class="panel-foot actions">
      <span class="spacer"></span>
      <button type="button" class="btn btn-secondary" id="quit">Quit</button>
      <button type="button" class="btn btn-primary" id="retry">Try again</button>
    </div>
  </section>

</main>
</body>
</html>
